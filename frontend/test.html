<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100vh;
            background: #0a0c12;
            color: #e8dfc8;
            font-family: Arial, sans-serif;
            font-size: 16px;
        }
        #container {
            padding: 40px;
            text-align: center;
        }
        h1 { margin-bottom: 20px; color: #f0c040; }
        p { margin-bottom: 10px; }
        .status { margin-top: 20px; padding: 10px; border: 1px solid #4a6fa5; }
    </style>
</head>
<body>
<div id="container">
    <h1>✅ Test Page - App is Loading</h1>
    <p>If you see this, the basic HTML/CSS is working.</p>
    
    <div class="status">
        <p><strong>Testing:</strong></p>
        <p id="css-test">CSS Loaded: ✅</p>
        <p id="font-test">Fonts: Testing...</p>
        <p id="js-test">JavaScript: ✓</p>
        <p id="main-js">main.js loaded: Checking...</p>
        <p id="class-check">Required classes: Checking...</p>
    </div>
    
    <div id="errors" style="margin-top: 20px; color: #e05050; display: none;">
        <p><strong>⚠️ Errors found:</strong></p>
        <pre id="error-log"></pre>
    </div>
</div>

<script>
    console.log("🔍 Test page loaded");
    
    // Check if main.js is loading
    window.addEventListener('error', (e) => {
        console.error('Script error:', e);
        document.getElementById('error-log').textContent += '\nScript Error: ' + e.message;
        document.getElementById('errors').style.display = 'block';
    });
    
    // Check if files exist
    setTimeout(() => {
        const classes = ['ApiClient', 'UIManager', 'ScreenManager', 'GameManager', 'StartScreen'];
        const missing = classes.filter(c => typeof window[c] === 'undefined');
        
        if (missing.length > 0) {
            document.getElementById('class-check').innerHTML = '⚠️ Missing: ' + missing.join(', ');
            document.getElementById('errors').style.display = 'block';
            document.getElementById('error-log').textContent += '\nMissing classes: ' + missing.join(', ');
        } else {
            document.getElementById('class-check').innerHTML = '✅ All classes loaded';
        }
    }, 2000);
    
    // Log all script tags loaded
    const scripts = document.querySelectorAll('script');
    console.log('Scripts on page:', scripts.length);
</script>

<!-- Load all game scripts -->
<script src="js/api/ApiClient.js?v=20260508"></script>
<script src="js/data/MockCatalog.js?v=20260508"></script>
<script src="js/Constants.js?v=20260508"></script>
<script src="js/data/maps.js?v=20260508"></script>
<script src="js/data/GameBalanceConfig.js?v=20260508"></script>
<script src="js/engine/EventBus.js?v=20260508"></script>
<script src="js/engine/LevelData.js?v=20260508"></script>
<script src="js/entities/Enemy.js?v=20260508"></script>
<script src="js/entities/Projectile.js?v=20260508"></script>
<script src="js/entities/Tower.js?v=20260508"></script>
<script src="js/engine/WaveManager.js?v=20260508"></script>
<script src="js/engine/LevelManager.js?v=20260508"></script>
<script src="js/components/ScreenManager.js?v=20260508"></script>
<script src="js/screens/StartScreen.js?v=20260508"></script>
<script src="js/screens/LevelSelectScreen.js?v=20260508"></script>
<script src="js/screens/GameScreen.js?v=20260508"></script>
<script src="js/engine/GameManager.js?v=20260508"></script>
<script src="js/ui/UIManager.js?v=20260508"></script>

<script>
    console.log("✅ All script tags defined");
    document.getElementById('main-js').innerHTML = '✅ Script tags loaded';
</script>

</body>
</html>
