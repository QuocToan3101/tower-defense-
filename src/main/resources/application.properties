# ============================================================
# Tower Defense - Application Configuration
# ============================================================

# Server
server.port=8080

# ─── Database ───────────────────────────────────────────────
# Cấu hình H2 Database (embedded - không cần cài MySQL)
spring.datasource.url=jdbc:h2:mem:tower_defense
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ─── H2 Console (để debug) ──────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── JPA / Hibernate ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# ─── JWT ────────────────────────────────────────────────────
app.jwt.secret=TowerDefenseSecretKey2024VeryLongSecureBase64EncodedString
app.jwt.expiration-ms=86400000

# ─── CORS ───────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000

# ─── Logging ────────────────────────────────────────────────
logging.level.com.towerdefense=DEBUG
logging.level.org.springframework.security=INFO